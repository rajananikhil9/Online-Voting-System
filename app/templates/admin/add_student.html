<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Student Voting System</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 520px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #64748b;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .messages {
            padding: 0;
            list-style: none;
        }

        .messages li {
            margin: 8px 0;
            padding: 12px;
            border-radius: 7px;
            background: #eff6ff;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Add New Student</h1>
        <p class="subtitle">
            Register a student for the College Student Voting System.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="messages">
                    {% for category, message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('student_import.add_student') }}">
            <label for="reg_no">Registration Number</label>
            <input
                type="text"
                id="reg_no"
                name="reg_no"
                required
                maxlength="50"
                autocomplete="off"
            >

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                maxlength="120"
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                maxlength="150"
            >

            <label for="department">Department</label>
            <input
                type="text"
                id="department"
                name="department"
                required
                maxlength="100"
            >

            <button type="submit">Register Student</button>
        </form>

        <a class="back-link" href="{{ url_for('admin_dashboard.dashboard') }}">
            Back to Admin Dashboard
        </a>
    </main>
</body>
</html>
